name: Validar treinamento do Portal IFMG
on:
  push:
    paths:
      - 'treinamento/**'
      - 'data/portal-graph.js'
      - 'data/guide-index.json'
      - 'scripts/test-training.mjs'
      - 'scripts/test-training-browser.mjs'
      - '.github/workflows/validate-training.yml'
  pull_request:
    paths:
      - 'treinamento/**'
      - 'data/portal-graph.js'
      - 'data/guide-index.json'
      - 'scripts/test-training.mjs'
      - 'scripts/test-training-browser.mjs'
      - '.github/workflows/validate-training.yml'
jobs:
  test-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-training.mjs
      - run: npm install --no-save --no-package-lock playwright-core
      - run: node scripts/test-training-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-qa-treinamento
          path: .qa-training/*.png
          if-no-files-found: ignore
