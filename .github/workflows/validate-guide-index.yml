name: Validar índice do guia

on:
  pull_request:
    paths:
      - "04 - Governança & Manuais/guia-do-portal/**"
      - "data/guide-index.json"
      - "scripts/generate-guide-index.mjs"
  push:
    branches:
      - main
    paths:
      - "04 - Governança & Manuais/guia-do-portal/**"
      - "data/guide-index.json"
      - "scripts/generate-guide-index.mjs"

jobs:
  guide-index:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar índice gerado
        run: node scripts/generate-guide-index.mjs --check
