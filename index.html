<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia do Portal IFMG</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>

<body>
    <nav class="sticky-nav" id="sticky-nav">
        <span class="nav-logo" id="nav-logo">guia do portal ifmg</span>
        <a href="#pastas-container" class="nav-link-pastas" id="nav-link-pastas">índice</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar para modo claro">tema</button>
    </nav>

    <header class="page-masthead">
        <section class="busca-principal" aria-label="Pesquisar no guia">
            <div class="busca-campo">
                <label class="sr-only" for="main-search-input">Descreva a tarefa que procura</label>
                <input type="search" id="main-search-input" placeholder="pesquisar no guia" autocomplete="off">
            </div>
        </section>
        <div class="masthead-copy">
            <h1>guia do<br>portal ifmg</h1>
            <p>manual de trabalho para o portal institucional</p>
        </div>
    </header>
    <main>
        <section class="orientacoes-iniciais" id="orientacoes-iniciais" aria-labelledby="orientacoes-iniciais-titulo">
            <h2 id="orientacoes-iniciais-titulo" class="sr-only">Orientações iniciais</h2>
            <div class="pastas-container pastas-orientacao" id="orientacoes-container">
                <!-- Orientações iniciais serão listadas aqui dinamicamente -->
            </div>
        </section>
        <section class="explorar-perfis" id="explorar-perfis" aria-labelledby="explorar-perfis-titulo">
            <h2 id="explorar-perfis-titulo">sou...</h2>
            <div class="pastas-container" id="pastas-container">
                <!-- Os perfis serão listados aqui dinamicamente -->
            </div>
        </section>
        <div class="resultados">
            <div class="cards-container">
                <!-- resultados -->
            </div>
        </div>
        <section class="perfil-leitor escondido" id="perfil-leitor" aria-live="polite">
            <nav class="artigo-breadcrumbs" id="perfil-breadcrumbs" aria-label="Caminho de navegação"></nav>
            <div class="perfil-cabecalho" id="perfil-cabecalho"></div>
            <div class="perfil-acoes" id="perfil-acoes"></div>
            <button id="btn-voltar-perfil" class="btn-voltar">← voltar para os perfis</button>
        </section>
        <div class="leitor-artigo escondido" id="leitor-artigo">
            <div class="artigo-layout-container">
                <aside class="artigo-toc-sidebar" id="artigo-toc-sidebar">
                    <div class="toc-header">
                        <span class="toc-title">Neste artigo</span>
                    </div>
                    <label class="toc-filter" id="toc-filter-container" hidden>
                        <span class="sr-only">Filtrar seções</span>
                        <input type="search" id="toc-filter-input" placeholder="filtrar seções">
                    </label>
                    <nav class="toc-nav" id="toc-nav" aria-label="Seções deste artigo"></nav>
                </aside>
                <div class="artigo-conteudo-wrapper">
                    <nav class="artigo-breadcrumbs" id="artigo-breadcrumbs" aria-label="Caminho de navegação"></nav>
                    <h2 id="artigo-titulo"></h2>
                    <div class="artigo-contexto" id="artigo-contexto"></div>
                    <div id="artigo-corpo" class="artigo-corpo"></div>
                    <nav class="artigo-nav-cards" id="artigo-nav-rodape" aria-label="Navegação entre artigos"></nav>
                    <div class="retorno-artigo">
                        <p id="retorno-artigo-texto">Quer continuar no guia?</p>
                        <button id="btn-voltar" class="btn-voltar">&larr; voltar para o guia</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
